<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="100%" height="auto" style="background-color: #ffffff; border-radius: 8px; border: 1px solid #e1e4e6; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292e">rslsqp vs SciPy SLSQP Speedup</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#586069">Higher is better</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bar-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
  </defs>

  <!-- X-Axis Grid Lines & Labels -->
  <g stroke="#eaecef" stroke-width="1">
    <line x1="280" y1="65" x2="280" y2="565" />
    <line x1="350" y1="65" x2="350" y2="565" />
    <line x1="420" y1="65" x2="420" y2="565" stroke="#95a5a6" stroke-dasharray="4" stroke-width="1.5" />
    <line x1="490" y1="65" x2="490" y2="565" />
    <line x1="560" y1="65" x2="560" y2="565" />
    <line x1="630" y1="65" x2="630" y2="565" />
    <line x1="700" y1="65" x2="700" y2="565" />
  </g>

  <g font-size="11" fill="#6a737d" text-anchor="middle">
    <text x="280" y="582">0.0x</text>
    <text x="350" y="582">0.5x</text>
    <text x="420" y="582" font-weight="bold" fill="#586069">1.0x (SciPy)</text>
    <text x="490" y="582">1.5x</text>
    <text x="560" y="582">2.0x</text>
    <text x="630" y="582">2.5x</text>
    <text x="700" y="582">3.0x</text>
  </g>

  <!-- Group 1: Least-Squares Fitting -->
  <text x="265" y="80" text-anchor="end" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">LEAST-SQUARES FITTING</text>
  <g font-size="12" fill="#24292e" font-weight="500">
    <text x="265" y="102" text-anchor="end">Least-squares fitting (n=20)</text>
    <rect x="280" y="89" width="140" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="428" y="102" font-size="11" font-weight="bold" fill="#d35400">1.00x</text>

    <text x="265" y="126" text-anchor="end">Least-squares fitting (n=40)</text>
    <rect x="280" y="113" width="184.8" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="472.8" y="126" font-size="11" font-weight="bold" fill="#d35400">1.32x</text>
  </g>

  <!-- Group 2: Rosenbrock (Unconstrained) -->
  <text x="265" y="164" text-anchor="end" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ROSENBROCK (UNCONSTRAINED)</text>
  <g font-size="12" fill="#24292e" font-weight="500">
    <text x="265" y="186" text-anchor="end">Rosenbrock unconstrained (n=50)</text>
    <rect x="280" y="173" width="179.2" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="467.2" y="186" font-size="11" font-weight="bold" fill="#d35400">1.28x</text>

    <text x="265" y="210" text-anchor="end">Rosenbrock unconstrained (n=100)</text>
    <rect x="280" y="197" width="162.4" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="450.4" y="210" font-size="11" font-weight="bold" fill="#d35400">1.16x</text>

    <text x="265" y="234" text-anchor="end">Rosenbrock unconstrained (n=200)</text>
    <rect x="280" y="221" width="168" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="456" y="234" font-size="11" font-weight="bold" fill="#d35400">1.20x</text>
  </g>

  <!-- Group 3: Rosenbrock (Constrained) -->
  <text x="265" y="282" text-anchor="end" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ROSENBROCK (CONSTRAINED)</text>
  <g font-size="12" fill="#24292e" font-weight="500">
    <text x="265" y="304" text-anchor="end">Rosenbrock constrained (n=50)</text>
    <rect x="280" y="291" width="191.8" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="479.8" y="304" font-size="11" font-weight="bold" fill="#d35400">1.37x</text>

    <text x="265" y="328" text-anchor="end">Rosenbrock constrained (n=100)</text>
    <rect x="280" y="315" width="189" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="477" y="328" font-size="11" font-weight="bold" fill="#d35400">1.35x</text>
  </g>

  <!-- Group 4: Quadratic with Inequalities -->
  <text x="265" y="386" text-anchor="end" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">QUADRATIC WITH INEQUALITIES</text>
  <g font-size="12" fill="#24292e" font-weight="500">
    <text x="265" y="408" text-anchor="end">Quadratic + 100 ineq (n=50)</text>
    <rect x="280" y="395" width="284.2" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="572.2" y="408" font-size="11" font-weight="bold" fill="#d35400">2.03x</text>

    <text x="265" y="432" text-anchor="end">Quadratic + 200 ineq (n=100)</text>
    <rect x="280" y="419" width="316.4" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="604.4" y="432" font-size="11" font-weight="bold" fill="#d35400">2.26x</text>
  </g>

  <!-- Group 5: Portfolio Optimisation -->
  <text x="265" y="480" text-anchor="end" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">PORTFOLIO OPTIMISATION</text>
  <g font-size="12" fill="#24292e" font-weight="500">
    <text x="265" y="502" text-anchor="end">Portfolio optimisation (n=50)</text>
    <rect x="280" y="489" width="225.4" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="513.4" y="502" font-size="11" font-weight="bold" fill="#d35400">1.61x</text>

    <text x="265" y="526" text-anchor="end">Portfolio optimisation (n=100)</text>
    <rect x="280" y="513" width="299.6" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="587.6" y="526" font-size="11" font-weight="bold" fill="#d35400">2.14x</text>

    <text x="265" y="550" text-anchor="end">Portfolio optimisation (n=200)</text>
    <rect x="280" y="537" width="354.2" height="16" rx="3" fill="url(#bar-gradient)" />
    <text x="642.2" y="550" font-size="11" font-weight="bold" fill="#d35400">2.53x</text>
  </g>

  <!-- Legend / Note -->
  <text x="490" y="612" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292e">Average Speedup: 1.54x (Geometric Mean)</text>
</svg>